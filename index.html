<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="排成台灣形狀的 3D 貓島：摸貓賺小魚乾、擺東西引來稀有貓、每座島都有小遊戲，還能自己當一隻貓走遍全島。">
<meta property="og:title" content="喵嶼群島">
<meta property="og:description" content="排成台灣形狀的 3D 貓島，摸貓、收集圖鑑、玩小遊戲，還能自己當一隻貓。">
<style>body { margin: 0; }</style>
<title>喵嶼群島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a full-bleed 3D lake; brand and toolbar float top-left, the island index docks right
   (a bottom sheet on phones), and an island's card opens on the left. */
:root {
  --paper: #F8F6FB; --card: #FFFFFF; --ink: #2A2742; --muted: #6E6987; --line: #E4DFEC;
  --accent: #E46A8C; --soft: #F3EEF8; --shadow: 0 10px 30px rgba(42, 39, 66, .14);
  --display: "Huninn", "Noto Sans TC", system-ui, sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --latin: "Fredoka", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1F1D2E; --card: #29263C; --ink: #F1EEF8; --muted: #A9A4C2; --line: #3B3854;
  --accent: #F28CA8; --soft: #332F49; --shadow: 0 10px 30px rgba(0, 0, 0, .4); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1F1D2E; --card: #29263C; --ink: #F1EEF8; --muted: #A9A4C2; --line: #3B3854;
  --accent: #F28CA8; --soft: #332F49; --shadow: 0 10px 30px rgba(0, 0, 0, .4); color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 14px/1.6 var(--body); }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; }
.labels { position: absolute; inset: 0; touch-action: none; }
.labels.off .pin { visibility: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.pin { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; border: 0; border-radius: 999px;
  background: var(--card); color: var(--ink); box-shadow: 0 3px 10px rgba(30, 25, 50, .22); font-size: 12.5px; font-weight: 500;
  white-space: nowrap; cursor: pointer; transition: transform .15s; }
.pin:hover { transform: translateY(-2px); }
.islet { font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--card) 70%, transparent);
  padding: 1px 8px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
.labels.off .islet { visibility: hidden; }
.pin.mini { padding: 4px; gap: 0; }
.pin.mini span { display: none; }
.pin i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent); }

.float { position: fixed; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }
.top { position: fixed; z-index: 3; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 10px; justify-items: start; }
.brand { position: static; padding: 12px 18px 12px 16px; display: flex; align-items: center; gap: 12px; }
.brand .mascot { width: 58px; height: 50px; flex: none; margin: -4px -2px -4px -6px; filter: drop-shadow(0 2px 3px rgba(30, 25, 50, .2)); }
.brand h1 { margin: 0; font: 400 28px/1 var(--display); letter-spacing: .04em; }
.brand p { margin: 4px 0 0; font: 500 11px/1.2 var(--latin); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.brand p span { font-family: var(--body); letter-spacing: .04em; text-transform: none; }

.tools { position: static; display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-radius: 14px; }
.seg { display: flex; background: var(--soft); border-radius: 10px; padding: 2px; }
.tools button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); }
.tools button:hover { color: var(--ink); }
.tools > button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(30, 25, 50, .18); }

#panel { z-index: 2; top: calc(16px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  right: max(16px, env(safe-area-inset-right, 0px)); width: 340px; display: flex; flex-direction: column; overflow: hidden; }
.phead { padding: 20px 20px 12px; display: grid; gap: 4px; }
.eyebrow { font: 600 11px/1 var(--latin); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.phead h2 { margin: 2px 0 0; font: 400 24px/1.25 var(--display); text-wrap: balance; }
#stats { margin: 0; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.search { margin-top: 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; border-radius: 12px; background: var(--soft); }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
#search { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--ink); outline: none; }
#search::placeholder { color: var(--muted); }
.search:focus-within { box-shadow: 0 0 0 2px var(--accent); }
#sheetToggle { display: none; }
#islandList { list-style: none; margin: 0; padding: 4px 10px 14px; overflow-y: auto; flex: 1; min-height: 0; }
#islandList li + li { border-top: 1px solid var(--line); }
.isle { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; padding: 9px 10px;
  border: 0; border-radius: 12px; background: transparent; text-align: left; cursor: pointer; }
.isle:hover, .isle[aria-current="true"] { background: color-mix(in srgb, var(--c) 22%, transparent); }
.hex { width: 34px; height: 38px; display: grid; place-items: center; background: var(--c); color: #2A2742;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); font: 400 16px/1 var(--display); }
.nm { display: grid; font-weight: 500; line-height: 1.3; min-width: 0; }
.nm small { font: 400 11.5px/1.3 var(--latin); color: var(--muted); letter-spacing: .02em; }
.ct { font: 500 13px/1 var(--latin); color: var(--muted); font-variant-numeric: tabular-nums; }
.ct::after { content: " 處"; font-family: var(--body); font-size: 11.5px; }
.hit { display: flex; justify-content: space-between; gap: 10px; width: calc(100% - 46px); margin: 0 0 6px 46px; padding: 6px 10px;
  border: 0; border-radius: 8px; background: var(--soft); text-align: left; font-size: 13px; cursor: pointer; }
.hit em, details em { font-style: normal; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.empty { padding: 18px 10px; color: var(--muted); }

#detail { z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); top: 214px; width: 340px;
  max-height: calc(100% - 230px - env(safe-area-inset-bottom, 0px)); overflow-y: auto; padding: 18px 20px 20px; }
.dhead { display: grid; grid-template-columns: 44px 1fr 32px; gap: 12px; align-items: center; }
.dhead .hex { width: 44px; height: 50px; font-size: 22px; }
.dhead h2 { margin: 2px 0 0; font: 400 24px/1.15 var(--display); }
#dEyebrow { color: color-mix(in srgb, var(--c) 55%, var(--ink)); }
#dClose { width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--soft); cursor: pointer; font-size: 18px; line-height: 1; align-self: start; }
#dBlurb { margin: 14px 0 10px; }
#dQuote { margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 3px solid var(--c); color: var(--muted); }
#dTags { display: flex; flex-wrap: wrap; gap: 6px; }
#dTags span { padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 28%, transparent); font-size: 12px; }
#detail h3 { margin: 18px 0 6px; font: 600 11px/1 var(--latin); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
#dItems { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
details { border-radius: 12px; background: var(--soft); }
summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; list-style: none; font-weight: 500; }
summary::-webkit-details-marker { display: none; }
summary span::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--c); vertical-align: 2px; }
details p { margin: 0; padding: 0 12px 10px 27px; color: var(--muted); font-size: 13px; }

#hint { position: fixed; z-index: 1; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding: 7px 14px; border-radius: 999px; background: color-mix(in srgb, var(--card) 88%, transparent); box-shadow: var(--shadow);
  font-size: 12.5px; color: var(--muted); transition: opacity .6s; }
#hint.gone { opacity: 0; pointer-events: none; }
.has-detail #hint { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- game layer ---------- */
.hudbar { position: static; display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-radius: 14px; }
.fish { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.fish svg { width: 24px; height: 14px; }
.fish b { font: 600 17px/1 var(--latin); color: var(--ink); font-variant-numeric: tabular-nums; min-width: 2ch; }
.fish.bump b { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.3); color: var(--accent); } }
#openDex { border: 0; border-radius: 9px; padding: 6px 12px; background: var(--ink); color: var(--paper); cursor: pointer; font-size: 13px; }

.heart { padding: 2px 8px; border-radius: 999px; background: #E46A8C; color: #fff; font: 600 13px/1.4 var(--latin);
  pointer-events: none; animation: rise 1.1s ease-out forwards; }
@keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-36px); opacity: 0; } }

#toasts { position: fixed; z-index: 6; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(420px, calc(100% - 32px)); }
.toast { margin: 0; padding: 8px 16px; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 13px;
  box-shadow: var(--shadow); text-align: center; animation: drop .3s; transition: opacity .5s; }
.toast.out { opacity: 0; }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } }

#catCard { z-index: 4; left: 50%; transform: translateX(calc(-50% - 180px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 12px; align-items: center; padding: 10px 16px 10px 10px; max-width: min(380px, calc(100% - 32px)); }
.has-detail #catCard { left: 372px; transform: none; }
#catCard svg { width: 48px; height: 48px; flex: none; }
#catCard div { display: grid; min-width: 0; }
#catCard small { color: var(--muted); font-size: 12px; }
.gain { font-size: 12.5px; color: var(--accent); font-weight: 500; }
.hearts { color: #E46A8C; letter-spacing: 1px; font-size: 13px; }
.hearts i { font-style: normal; color: var(--line); }

.slotNow { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.slotNow b, .buy b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; }
.slotNow strong { color: var(--ink); font-weight: 600; }
.shop { display: grid; gap: 4px; }
.buy { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 10px; background: transparent; text-align: left; cursor: pointer; }
.buy:hover:not(:disabled) { border-color: var(--accent); }
.buy:disabled { opacity: .45; cursor: not-allowed; }
.buy span { display: grid; font-size: 13px; line-height: 1.3; }
.buy small { color: var(--muted); font-size: 11.5px; }
.buy em { font: 600 13px/1 var(--latin); font-style: normal; color: var(--ink); }
.buy em::after { content: " 魚乾"; font: 400 11px var(--body); color: var(--muted); }

#dex { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(20, 18, 34, .45);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#dex[hidden] { display: none; }
.dexBox { position: relative; width: min(760px, 100%); max-height: 100%; overflow-y: auto; padding: 20px; }
.dexBox header { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.dexBox h2 { margin: 4px 0 0; font: 400 24px/1.2 var(--display); }
#dexCount { font: 500 15px var(--latin); color: var(--muted); }
#dexClose { width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--soft); cursor: pointer; font-size: 18px; }
.dexTip { margin: 6px 0 14px; color: var(--muted); font-size: 13px; }
#dexGrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
#dexGrid li { display: grid; justify-items: center; text-align: center; gap: 2px; padding: 10px 8px; border-radius: 12px; background: var(--soft); }
#dexGrid li.rare { box-shadow: inset 0 0 0 1.5px #E9C46A; }
#dexGrid svg { width: 44px; height: 44px; }
#dexGrid b { font-size: 13.5px; }
#dexGrid small { font-size: 11px; color: var(--muted); line-height: 1.35; }
#dexGrid .unknown b { color: var(--muted); }

/* ---------- island games, part two ---------- */
.kbStage { display: grid !important; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 18px; align-content: center; background: #D9D3E6 !important; }
.key { aspect-ratio: 1.15; border: 0; border-radius: 10px; background: #F7F5FA; color: #5C5A6A; font: 600 20px/1 var(--latin);
  box-shadow: 0 4px 0 #B6AFC6; cursor: pointer; transition: background .1s, transform .08s; }
.key.lit { background: #F4D27A; color: #2A2742; box-shadow: 0 4px 0 #C99A3B; }
.key.pawed { transform: translateY(3px); box-shadow: 0 1px 0 #B6AFC6; background: #F2B8C0; }

.scrStage { display: grid !important; place-content: center; gap: 18px; padding: 24px; background: linear-gradient(#EFE3CC, #E2C9A5) !important; cursor: pointer; }
.scrStage .post { position: relative; width: min(460px, 76vw); height: 54px; border-radius: 12px;
  background: repeating-linear-gradient(90deg, #CDB283 0 10px, #BFA272 10px 20px); box-shadow: inset 0 0 0 3px #8C6B4F; }
.scrStage .zone { position: absolute; top: 0; bottom: 0; background: rgba(111, 174, 106, .75); border-radius: 8px; }
.scrStage .needle { position: absolute; top: -10px; bottom: -10px; width: 5px; margin-left: -2px; border-radius: 3px; background: #2A2742; }
.scrStage.miss .post { box-shadow: inset 0 0 0 3px #E05D5D; }
.scrTip { margin: 0; text-align: center; color: #5C4A3A; font-size: 13px; }
.marks { position: relative; height: 40px; }
.marks span { position: absolute; top: 0; width: 22px; height: 34px; border-radius: 3px;
  background: repeating-linear-gradient(100deg, transparent 0 4px, #8C6B4F 4px 6px, transparent 6px 9px); }

.pillStage { display: grid !important; place-content: center; justify-items: center; gap: 22px; background: linear-gradient(#EAF4F2, #CFE5E1) !important; }
.pmsg { margin: 0; color: #2A2742; font-weight: 500; }
.jars { display: flex; gap: 14px; }
.jar { position: relative; width: 70px; height: 96px; border: 0; border-radius: 14px 14px 18px 18px; cursor: pointer;
  background: color-mix(in srgb, var(--c) 45%, #fff); box-shadow: inset 0 0 0 3px var(--c); transition: transform .1s; }
.jar i { position: absolute; left: 10px; right: 10px; top: -10px; height: 16px; border-radius: 6px; background: #FBFAF8; box-shadow: inset 0 0 0 2px var(--c); }
.jar.on { background: var(--c); transform: scale(1.08); box-shadow: 0 0 22px var(--c); }
.jar:disabled { cursor: default; }

.matchStage { display: grid !important; align-content: center; gap: 16px; padding: 18px; background: linear-gradient(#FFF3F0, #F8DCD8) !important; }
.wish { display: flex; align-items: center; gap: 12px; justify-self: center; padding: 10px 18px; border-radius: 14px; background: #fff; color: #2A2742; box-shadow: 0 3px 10px rgba(30, 25, 50, .12); }
.wish svg { width: 54px; height: 54px; }
.wish div { display: grid; }
.wish b { font-size: 12px; color: #6E6987; font-weight: 500; }
.wish span { font: 400 20px/1.3 var(--display); }
.homes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.home { display: grid; justify-items: center; gap: 6px; padding: 14px 8px; border: 0; border-radius: 14px; background: #fff; color: #2A2742; cursor: pointer; box-shadow: 0 3px 10px rgba(30, 25, 50, .1); }
.home b { font: 400 16px/1.2 var(--display); }
.home em { font-style: normal; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: #F3EEF8; }
.home.right { box-shadow: 0 0 0 3px #6FAE6A; }
.home.wrong { box-shadow: 0 0 0 3px #E05D5D; }

.hushStage { background: linear-gradient(#C9DAEE, #A9C4E8) !important; }
.sleeper { position: absolute; width: 74px; transform: translate(-50%, -50%); text-align: center; transition: transform .15s; }
.sleeper svg { width: 74px; height: 74px; }
.sleeper i { position: absolute; right: -8px; top: -6px; font: 600 14px var(--latin); font-style: normal; color: #4B5A7A; }
.sleeper.awake { transform: translate(-50%, -62%) rotate(-6deg); }
.sleeper.awake i { color: #E05D5D; }
.noise { position: absolute; transform: translate(-50%, -50%); padding: 6px 12px; border: 0; border-radius: 12px; cursor: pointer;
  background: #fff; color: #2A2742; font: 400 16px/1 var(--display); box-shadow: 0 0 0 3px #E05D5D; animation: fuse var(--life, 1500ms) linear forwards; }
@keyframes fuse { from { box-shadow: 0 0 0 3px #F4D27A; } to { box-shadow: 0 0 0 6px #E05D5D; } }
.hlives { position: absolute; left: 14px; top: 10px; margin: 0; color: #E46A8C; font: 600 18px var(--latin); }

/* ---------- cat mode ---------- */
#openCat { border: 0; border-radius: 9px; padding: 6px 12px; background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; }
.cat-mode #panel, .cat-mode #detail, .cat-mode #hint { display: none !important; }
.cat-mode .pin { pointer-events: none; }
#catHud > * { z-index: 5; }
#cVisit { right: max(16px, env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); margin: 0; padding: 8px 14px;
  font-weight: 500; font-variant-numeric: tabular-nums; }
.ckeys { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0; padding: 7px 14px;
  font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.cbtns { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(2, 64px); gap: 8px; }
.cbtns button { height: 52px; border: 0; border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: var(--shadow);
  font: 400 18px/1 var(--display); cursor: pointer; }
.cbtns button:active { transform: scale(.95); }
#cMeow { background: var(--accent); color: #fff; }
#cExit { font-size: 15px; }
#joy { display: none; position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: 124px; height: 124px; border-radius: 50%; background: color-mix(in srgb, var(--card) 55%, transparent);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ink) 18%, transparent); touch-action: none; }
#joy span { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
  background: var(--card); box-shadow: var(--shadow); }
@media (pointer: coarse), (max-width: 759px) { #joy { display: block; } .ckeys { display: none; } }
@media (max-width: 759px) { #cVisit { top: calc(186px + env(safe-area-inset-top, 0px)); font-size: 13px; padding: 6px 12px; } }
.meow { padding: 3px 10px; border-radius: 12px 12px 12px 2px; background: #fff; color: #2A2742; font: 400 15px/1.3 var(--display);
  box-shadow: 0 3px 10px rgba(30, 25, 50, .25); pointer-events: none; }

/* ---------- mini-games ---------- */
.playBtn { margin-top: 12px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px;
  border: 0; border-radius: 12px; background: var(--c); color: #2A2742; font-weight: 600; cursor: pointer; }
.playBtn small { font-weight: 400; font-size: 12px; opacity: .8; }
#gameLayer { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(20, 18, 34, .5);

.shellStage { background: linear-gradient(#F3E7D6, #E2C9A5) !important; }
.sbox { position: absolute; bottom: 20%; width: 26%; max-width: 150px; aspect-ratio: 1 / .78; transform: translateX(-50%);
  border: 0; border-radius: 10px; background: #C89A63; cursor: pointer; transition: left var(--speed, 300ms) ease-in-out; padding: 0; }
.sbox::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 18%; background: #B98955; border-radius: 10px 10px 0 0; }
.sbox i { position: absolute; left: 42%; right: 42%; top: 0; bottom: 0; background: #E9D2A6; }
.sbox:disabled { cursor: default; }
.sbox:not(:disabled):hover { outline: 3px solid var(--accent); outline-offset: 2px; }
.peek { position: absolute; left: 20%; right: 20%; bottom: 55%; opacity: 0; transform: translateY(40%); transition: opacity .2s, transform .25s; }

@keyframes nope { 25% { margin-left: -6px; } 75% { margin-left: 6px; } }
